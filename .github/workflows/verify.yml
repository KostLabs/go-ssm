on:
  push:
    branches:
      - feat/**
      - fix/**
      - improv/**
      - chore/**
      - refactor/**
      - bugfix/**

jobs:
  fmt-vet:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: |
          go fmt ./...
          go vet ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          args: ./

  gosec:
    name: Gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: securego/gosec@master
        with:
          args: ./

  go-verifier:
    name: Go Verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: |
          go install github.com/KostLabs/go-verifier/cmd/goverifier@latest
          goverifier -disable logging ./...
